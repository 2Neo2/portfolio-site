  - slug: qgis-transport-plugin
    name: Анализ транспортных потоков Московской области
    summary: Плагин для QGIS и API на DRF для оптимизации маршрутной сети общественного транспорта
    problem: |
      Министерству транспорта Московской области нужно было находить перегруженные
      маршруты и остановки и перестраивать маршрутную сеть, а выгрузка транспортных
      данных для анализа шла скриптом, который запускали на всю ночь.
    solution: |
      Разработал плагин для QGIS на PyQt: он находит самые загруженные муниципалитеты,
      маршруты, перегоны и остановки, строит новые оптимальные маршруты для разгрузки
      пассажиропотока и выгружает результаты анализа в Excel. Для данных спроектировал
      API на DRF с асинхронной загрузкой по чанкам и отдельными эндпоинтами маршрутов,
      которые использует плагин.
    results:
      - Оптимизация выгрузки данных — вместо скрипта, запущенного на ночь, асинхронная загрузка по чанкам за пару часов
      - Награда «Прорыв года»
    stack: [Python, PyQt, QGIS, Django REST Framework]
    screenshots:
      - src: /static/img/projects/qgis-transport-plugin/route-load.webp
        alt: "Загруженность остановок и перегонов на маршруте"
      - src: /static/img/projects/qgis-transport-plugin/qgis-layers.webp
        alt: "Плагин в QGIS: загруженность каждой остановки маршрута"
      - src: /static/img/projects/qgis-transport-plugin/population-density.webp
        alt: "Слой плотности населения Москвы и Московской области"
      - src: /static/img/projects/qgis-transport-plugin/municipal-routes.webp
        alt: "Маршрутная сеть муниципалитета"
    featured: true

  - slug: hotel-booking-mini-app
    name: Бронирование отелей в Telegram Mini App
    summary: Telegram Mini App на Vue 3 для поиска и бронирования отелей с данными из API провайдера
    problem: |
      Заказчику нужно было, чтобы пользователи искали и бронировали отели прямо
      в Telegram, без отдельного приложения. Данные об отелях, ценах и номерах
      предоставляет провайдер — компания-партнёр заказчика.
    solution: |
      Разработал мини-приложение на Vue 3 и TypeScript, которое напрямую обращается
      к API провайдера за отелями, ценами и номерами. Пользователь ищет отели по городу,
      датам, звёздности и типу питания, смотрит выдачу с фото и ценами и отели на карте.
      Интеграция с Telegram — через vue-tg.
    results:
      - Поиск, выдача и карта отелей — прямо в Telegram, без отдельного приложения
    stack: [Vue 3, TypeScript, Vite, vue-tg, Telegram Mini Apps, REST API]
    screenshots:
      - src: /static/img/projects/hotel-booking-mini-app/search.webp
        alt: "Поиск: город, даты, звёздность, питание"
        device: mobile
      - src: /static/img/projects/hotel-booking-mini-app/hotels-list.webp
        alt: "Выдача отелей с фото и ценами"
        device: mobile
      - src: /static/img/projects/hotel-booking-mini-app/map-light.webp
        alt: "Отели на карте"
        device: mobile
      - src: /static/img/projects/hotel-booking-mini-app/map-dark.webp
        alt: "Карта с ценами в тёмной теме"
        device: mobile
    featured: true

  - slug: agentguard
    name: AgentGuard — ВКР магистратуры
    summary: "Система защиты LLM-агентов от эскалации привилегий через атаки на LLM: каждое действие агента проверяется до выполнения"
    problem: |
      LLM-агенты, которые умеют выполнять системные команды, уязвимы к prompt injection:
      через обычный запрос злоумышленник может заставить агента удалить системные логи
      или сбросить пароль администратора. Нужен слой, который проверяет каждое действие
      агента до того, как оно выполнится.
    solution: |
      Агентский граф на LangGraph из семи узлов: разбор запроса и поиск признаков prompt
      injection, оценка риска от 0 до 100, план действия, контроль привилегий (политика
      разрешает или блокирует действие по уровню прав user / admin / root), выполнение
      в песочнице, аудит каждого решения в JSONL-журнал и ответ пользователю через
      локальную LLM (Ollama, Llama 2). Режимы baseline и protected позволяют сравнить
      поведение агента без защиты и с ней.
    results:
      - 7 узлов графа — от разбора запроса до аудита
      - Опасные действия блокируются до выполнения, если не хватает прав
      - Каждое решение агента записывается в журнал аудита
    stack: [Python, LangGraph, LangChain, Ollama, Llama 2]
    links:
      repo: https://github.com/lalmark/agentguard-llm-security
    diagram: agentguard
    featured: true

  - slug: portfolio-site
    name: Этот сайт
    summary: Сайт-визитка на FastAPI с JSON API, тестами и двумя языками
    problem: |
      Нужна визитка, которая не только рассказывает о навыках, но и показывает их.
