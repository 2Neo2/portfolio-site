projects:
  - slug: telegram-bots-platform
    name: Платформа Telegram-ботов
    summary: Бэкенд семейства Telegram-ботов с интеграцией внешних сервисов
    problem: |
      Компании нужно работать с множеством внешних провайдеров
      в нескольких ботах одновременно, а операторам — быстро обрабатывать заявки
      и видеть статистику.
    solution: |
      Django-проект с модульной архитектурой: внешние сервисы подключаются
      через единый интерфейс, есть KYC и 2FA, админ-панель для операторов,
      статистика, промо-механики и cron-рассылки.
    results:
      - 10+ интеграций с внешними API
      - 1 000+ заявок в день
      - 500+ коммитов с августа 2024
    stack: [Python, Django, pyTelegramBotAPI, PostgreSQL, Docker]
    links:
      repo: null
      demo: null
    featured: true

  - slug: jobradar
    name: JobRadar
    summary: Telegram-бот, который собирает вакансии из нескольких источников и ведёт трекер откликов
    problem: |
      Вакансии разбросаны по hh.ru, getmatch, Хабр Карьере и Telegram-каналам —
      мониторить их вручную долго и легко что-то пропустить.
    solution: |
      Асинхронный агрегатор: парсеры источников по расписанию, скоринг вакансий
      под заданные фильтры, уведомления в Telegram и трекер статусов откликов.
    results:
      - 4 источника вакансий
      - 200+ вакансий в день после фильтрации
    stack: [Python, aiogram 3, FastAPI, SQLAlchemy 2.0, Alembic, Docker, pytest]
    links:
      repo: https://github.com/2Neo2/jobradar
      demo: null
    featured: true

  - slug: portfolio-site
    name: Этот сайт
    summary: Сайт-визитка на FastAPI с JSON API, тестами, Docker и CI/CD
    problem: |
      Нужна визитка, которая не только рассказывает о навыках, но и показывает их.
    solution: |
      FastAPI + Jinja2, контент в YAML с валидацией через Pydantic, публичный
