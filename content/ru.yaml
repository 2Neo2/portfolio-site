projects:
  - slug: viralscope
    name: ViralScope
    summary: "Сервис поиска виральных Reels: собирает видео из Instagram по нише, считает процент виральности и объясняет через Claude, почему ролик «залетел» и как снять свой"
    problem: |
      Бизнесу, блогерам и обычным пользователям нужно понимать, какие Reels
      в их нише «залетают» и почему. Искать такие ролики вручную и разбирать,
      как снять похожий, очень долго.
    stack: [Python, FastAPI, Pydantic, structlog, PostgreSQL, Redis, Docker, Grafana, Loki, Alloy, pytest, ruff]
    links:
      repo: https://github.com/2Neo2/viralscope-backend
    screenshots:
      - src: /static/img/projects/viralscope/landing.jpg
        alt: "Лендинг с набором в поток"
      - src: /static/img/projects/viralscope/feed.jpg
        alt: "Кабинет: подборка виральных видео с разбором «почему залетело»"
    featured: true

  - slug: hotel-booking-mini-app
    name: Бронирование отелей в Telegram Mini App
    summary: Бэкенд на FastAPI для Telegram Mini App бронирования отелей с интеграцией API поставщика
    problem: |
      Пользователям нужно бронировать отели прямо в Telegram, без отдельного
      приложения, а данные о бронированиях — совпадать с данными поставщика.
    solution: |
      Разработал бэкенд на FastAPI: интеграция с API поставщика, обработка статусов
      бронирований в реальном времени. Ключевые эндпоинты и бизнес-логика покрыты
      тестами на pytest с mock и Faker.
    results:
      - Статусы бронирований обновляются в реальном времени
      - Ключевые эндпоинты покрыты тестами
    stack: [Python, FastAPI, Telegram Mini Apps, pytest]
    featured: true

  - slug: qgis-transport-plugin
    name: Анализ транспортных потоков Московской области
    summary: Плагин для QGIS и API на DRF для оптимизации маршрутной сети общественного транспорта
    problem: |
      Министерству транспорта Московской области нужно было находить перегруженные
      маршруты и остановки и перестраивать маршрутную сеть, а выгрузка транспортных
      данных для анализа шла скриптом, который запускали на всю ночь.
    solution: |
      Разработал плагин для QGIS на PyQt: он находит самые загруженные муниципалитеты,
      маршруты, перегоны и остановки, строит новые оптимальные маршруты для разгрузки
      пассажиропотока и выгружает результаты анализа в Excel. Для данных спроектировал
      API на DRF с асинхронной загрузкой по чанкам и отдельными эндпоинтами маршрутов,
      которые использует плагин.
    results:
      - Оптимизация выгрузки данных — вместо скрипта, запущенного на ночь, асинхронная загрузка по чанкам за пару часов
      - Награда «Прорыв года»
    stack: [Python, PyQt, QGIS, Django REST Framework]
    screenshots:
      - src: /static/img/projects/qgis-transport-plugin/route-load.webp
        alt: "Загруженность остановок и перегонов на маршруте"
      - src: /static/img/projects/qgis-transport-plugin/qgis-layers.webp
        alt: "Плагин в QGIS: загруженность каждой остановки маршрута"
      - src: /static/img/projects/qgis-transport-plugin/population-density.webp
        alt: "Слой плотности населения Москвы и Московской области"
      - src: /static/img/projects/qgis-transport-plugin/municipal-routes.webp
        alt: "Маршрутная сеть муниципалитета"
    featured: true

  - slug: llm-content-bot
    name: Telegram-бот для генерации контента на LLM
    summary: Бот, который генерирует контент через API OpenAI и помнит историю диалога
    problem: |
      Нужно было автоматизировать подготовку контента с помощью LLM в привычном
      для пользователей интерфейсе Telegram.
    solution: |
      Сам спроектировал архитектуру бота, интегрировал LLM через API OpenAI,
      настроил промпты и хранение истории диалога.
    results:
      - Архитектура, промпты и хранение истории диалога — с нуля
    stack: [Python, python-telegram-bot, OpenAI API]
    featured: false

  - slug: jobradar
    name: JobRadar
    summary: Telegram-бот, который собирает вакансии из нескольких источников и ведёт трекер откликов
    problem: |
      Вакансии разбросаны по hh.ru, getmatch, Хабр Карьере и Telegram-каналам —
      мониторить их вручную долго и легко что-то пропустить.
    solution: |
      Асинхронный агрегатор: парсеры источников по расписанию, скоринг вакансий
      под заданные фильтры, уведомления в Telegram и трекер статусов откликов.
    results:
      - 4 источника вакансий
    stack: [Python, aiogram 3, FastAPI, SQLAlchemy 2.0, Alembic, Docker, pytest]
    featured: false

  - slug: portfolio-site
    name: Этот сайт
    summary: Сайт-визитка на FastAPI с JSON API, тестами и двумя языками
    problem: |
      Нужна визитка, которая не только рассказывает о навыках, но и показывает их.
    solution: |
      FastAPI + Jinja2, контент в YAML с валидацией через Pydantic, публичный
      JSON API, русская и английская версии, тесты на pytest.
    results:
      - 100% покрытие тестами
      - 2 языковые версии сайта и API
    stack: [Python, FastAPI, Pydantic, Jinja2, pytest]
    links:
      repo: https://github.com/2Neo2/portfolio-site
    featured: false

