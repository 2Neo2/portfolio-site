        alt: "Главная страница"
      - src: /static/img/projects/gabriel-spa/menu.jpg
        alt: "Категории услуг с анимированными иллюстрациями"
      - src: /static/img/projects/gabriel-spa/services.jpg
        alt: "Прайс: 110 процедур в 11 направлениях"
      - src: /static/img/projects/gabriel-spa/service.jpg
        alt: "Страница услуги с записью на выбранное время"
    featured: true

  - slug: agentguard
    name: AgentGuard — ВКР магистратуры
    summary: "Система защиты LLM-агентов от эскалации привилегий через атаки на LLM: каждое действие агента проверяется до выполнения"
    problem: |
      LLM-агенты, которые умеют выполнять системные команды, уязвимы к prompt injection:
      через обычный запрос злоумышленник может заставить агента удалить системные логи
      или сбросить пароль администратора. Нужен слой, который проверяет каждое действие
      агента до того, как оно выполнится.
    solution: |
      Агентский граф на LangGraph из семи узлов: разбор запроса и поиск признаков prompt
      injection, оценка риска от 0 до 100, план действия, контроль привилегий (политика
      разрешает или блокирует действие по уровню прав user / admin / root), выполнение
      в песочнице, аудит каждого решения в JSONL-журнал и ответ пользователю через
      локальную LLM (Ollama, Llama 2). Режимы baseline и protected позволяют сравнить
      поведение агента без защиты и с ней.
    results:
      - 7 узлов графа — от разбора запроса до аудита
      - Опасные действия блокируются до выполнения, если не хватает прав
      - Каждое решение агента записывается в журнал аудита
    stack: [Python, LangGraph, LangChain, Ollama, Llama 2]
    links:
      repo: https://github.com/lalmark/agentguard-llm-security
    diagram: agentguard
    featured: true

  - slug: teamplayer
    name: TeamPlayer — ВКР бакалавриата
    summary: iOS-приложение для совместного прослушивания музыки в сообществах — общий плеер, чат и плейлисты в реальном времени
    problem: |
      Слушать музыку вместе с друзьями на расстоянии неудобно: каждый включает трек
      у себя, и воспроизведение расходится. Нужны общие комнаты-сообщества, где у всех
      участников играет одно и то же и музыку можно обсуждать в чате.
    solution: |
      Проект из трёх частей. iOS-приложение на Swift и UIKit: главная с публичными
      сообществами, поиск, медиатека и плейлисты, комната с общим плеером и чатом.
      Сервер на Vapor с PostgreSQL (Fluent, миграции): пользователи и токены, комнаты —
      публичные и по коду, участники и роль DJ, рейтинг комнат, плейлисты. Через WebSocket
      сервер раздаёт аудио по чанкам всем участникам комнаты, синхронизирует команды
      play / pause / next / back и ведёт чат. Отдельный сервис на FastAPI работает
      с Яндекс Музыкой: поиск, треки, альбомы, избранное и плейлист дня.
    results:
      - 3 сервиса — iOS-приложение, сервер на Vapor и сервис на FastAPI
      - Синхронное воспроизведение у всех участников комнаты через WebSocket
      - Чат сообщества в реальном времени
    stack: [Swift, UIKit, Vapor, Fluent, PostgreSQL, WebSocket, Python, FastAPI, Docker]
    links:
      repos:
        - label: iOS-приложение
          url: https://github.com/2Neo2/TeamPlayer
        - label: Сервер на Vapor
          url: https://github.com/2Neo2/TeamPlayer-main
        - label: Сервис Яндекс Музыки
          url: https://github.com/2Neo2/TeamPlayer-YM
    screenshots:
      - src: /static/img/projects/teamplayer/home.webp
        alt: "Главная: публичные сообщества и новые треки"
        device: mobile
      - src: /static/img/projects/teamplayer/room.webp
        alt: "Комната: общий плеер и чат сообщества"
        device: mobile
      - src: /static/img/projects/teamplayer/playlist.webp
        alt: "Плейлист в медиатеке"
        device: mobile
      - src: /static/img/projects/teamplayer/members.webp
        alt: "Управление участниками сообщества"
        device: mobile
    featured: true

