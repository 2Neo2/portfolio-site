  - slug: gabriel-spa
    name: Габриэль — сайт СПА-студии
    summary: Сайт СПА-студии в Норильске на Flask — каталог из 110 услуг с ценами и онлайн-запись через YCLIENTS
    problem: |
      Студии нужен собственный сайт с актуальным прайсом и онлайн-записью. Услуги, цены
      и запись уже ведутся в YCLIENTS, поэтому сайт должен брать данные оттуда, а не
      дублировать их вручную.
    solution: |
      Flask-приложение с фабрикой create_app и блюпринтами, модели категорий и услуг
      на SQLAlchemy. Прайс импортируется из выгрузки YCLIENTS CLI-командой flask import-xls —
      149 услуг, а на сайт попадают только доступные в онлайн-записи. Кнопка «Записаться»
      открывает YCLIENTS сразу на нужной услуге или мастере. Дизайн — тёмная палитра
      и анимации на чистом JavaScript без тяжёлых библиотек, с учётом prefers-reduced-motion.
      Страницы покрыты тестами на pytest.
    results:
      - 110 услуг с онлайн-записью из 149 в прайсе YCLIENTS
      - Запись в один клик сразу на нужную услугу
      - Обновление прайса одной командой из выгрузки YCLIENTS
    stack: [Python, Flask, SQLAlchemy, SQLite, YCLIENTS, JavaScript, pytest, gunicorn]
    screenshots:
