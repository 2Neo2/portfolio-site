projects:
  - slug: hotel-booking-mini-app
    name: Hotel booking Telegram Mini App
    summary: FastAPI backend for a hotel booking Telegram Mini App with supplier API integration
    problem: |
      Users need to book hotels right inside Telegram, without a separate app,
      and booking data has to stay in sync with the supplier.
    solution: |
      Built a FastAPI backend: supplier API integration and real-time booking status
      processing. Key endpoints and business logic are covered with pytest tests
      using mock and Faker.
    results:
      - Booking statuses are updated in real time
      - Key endpoints are covered with tests
    stack: [Python, FastAPI, Telegram Mini Apps, pytest]
    featured: true

  - slug: qgis-transport-plugin
    name: Moscow Region traffic flow analysis
    summary: A QGIS plugin and a DRF API for optimizing the public transport route network
    problem: |
      The Moscow Region Ministry of Transport needed to find overloaded routes and
      stops and rebuild the route network, while exporting transport data for
      analysis took about 12 hours.
    solution: |
      Built a QGIS plugin with PyQt: it finds the busiest municipalities, routes,
      segments and stops, builds new optimal routes to relieve passenger load and
      exports the analysis to Excel. Designed a DRF API for the data, with dedicated
      route endpoints used by the plugin.
    results:
      - 24× faster data export — 30 minutes instead of ~12 hours
      - «Breakthrough of the Year» award
    stack: [Python, PyQt, QGIS, Django REST Framework]
    featured: true

  - slug: llm-content-bot
    name: LLM-powered content Telegram bot
    summary: A bot that generates content via the OpenAI API and keeps dialogue history
    problem: |
      Content preparation needed to be automated with an LLM inside the familiar
      Telegram interface.
    solution: |
      Designed the bot architecture myself, integrated an LLM via the OpenAI API,
      tuned the prompts and implemented dialogue history storage.
    results:
      - Architecture, prompts and dialogue history built from scratch
    stack: [Python, python-telegram-bot, OpenAI API]
    featured: false

  - slug: jobradar
    name: JobRadar
    summary: A Telegram bot that aggregates job openings from several sources and tracks applications
    problem: |
      Job openings are scattered across hh.ru, getmatch, Habr Career and Telegram
      channels — monitoring them by hand takes time and it's easy to miss something.
    solution: |
      An asynchronous aggregator: scheduled source parsers, scoring of openings
      against custom filters, Telegram notifications and an application tracker.
    results:
      - 4 job sources
    stack: [Python, aiogram 3, FastAPI, SQLAlchemy 2.0, Alembic, Docker, pytest]
    featured: false

  - slug: portfolio-site
    name: This website
    summary: Portfolio website on FastAPI with a JSON API, tests and two languages
    problem: |
      I needed a portfolio site that doesn't just list my skills but demonstrates them.
    solution: |
      FastAPI + Jinja2, YAML content validated with Pydantic, a public JSON API,
      Russian and English versions, pytest tests.
    results:
      - 100% test coverage
      - 2 language versions of the site and API
    stack: [Python, FastAPI, Pydantic, Jinja2, pytest]
    links:
      repo: https://github.com/2Neo2/portfolio-site
    featured: false

