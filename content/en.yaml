  - slug: qgis-transport-plugin
    name: Moscow Region traffic flow analysis
    summary: A QGIS plugin and a DRF API for optimizing the public transport route network
    problem: |
      The Moscow Region Ministry of Transport needed to find overloaded routes and
      stops and rebuild the route network, while transport data for analysis was
      exported by a script that had to run overnight.
    solution: |
      Built a QGIS plugin with PyQt: it finds the busiest municipalities, routes,
      segments and stops, builds new optimal routes to relieve passenger load and
      exports the analysis to Excel. Designed a DRF API for the data with asynchronous
      chunked loading and dedicated route endpoints used by the plugin.
    results:
      - Optimized data export — instead of an overnight script, asynchronous chunked loading in a couple of hours
      - «Breakthrough of the Year» award
    stack: [Python, PyQt, QGIS, Django REST Framework]
    screenshots:
      - src: /static/img/projects/qgis-transport-plugin/route-load.webp
        alt: "Stop and segment load along a route"
      - src: /static/img/projects/qgis-transport-plugin/qgis-layers.webp
        alt: "The plugin in QGIS: load at every stop of a route"
      - src: /static/img/projects/qgis-transport-plugin/population-density.webp
        alt: "Population density layer for Moscow and the Moscow Region"
      - src: /static/img/projects/qgis-transport-plugin/municipal-routes.webp
        alt: "A municipal route network"
    featured: true

  - slug: hotel-booking-mini-app
    name: Hotel booking Telegram Mini App
    summary: A Vue 3 Telegram Mini App for searching and booking hotels with data from a provider API
    problem: |
      The client wanted users to search and book hotels right inside Telegram,
