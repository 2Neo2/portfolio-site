  - slug: agentguard
    name: AgentGuard — Master's thesis
    summary: "Protecting LLM agents from privilege escalation via attacks on the LLM: every agent action is checked before it runs"
    problem: |
      LLM agents that can run system commands are vulnerable to prompt injection:
      with an ordinary request an attacker can make the agent delete system logs or
      reset the admin password. A layer is needed that checks every agent action
      before it is executed.
    solution: |
      A seven-node LangGraph agent graph: request parsing and prompt injection detection,
      risk scoring from 0 to 100, action planning, privilege control (a policy allows or
      blocks the action based on the user / admin / root privilege level), sandboxed
      execution, auditing of every decision to a JSONL log, and a response via a local
      LLM (Ollama, Llama 2). Baseline and protected modes make it possible to compare
      the agent's behaviour without and with protection.
    results:
      - 7 graph nodes — from request parsing to audit
      - Dangerous actions are blocked before execution when privileges are insufficient
      - Every agent decision is written to the audit log
    stack: [Python, LangGraph, LangChain, Ollama, Llama 2]
    links:
      repo: https://github.com/lalmark/agentguard-llm-security
    diagram: agentguard
    featured: true

  - slug: teamplayer
    name: TeamPlayer — Bachelor's thesis
    summary: An iOS app for listening to music together in communities — a shared player, chat and playlists in real time
    problem: |
      Listening to music with friends remotely is awkward: everyone starts the track
      on their own device and playback drifts apart. Shared community rooms are needed
      where all members hear the same thing and can discuss the music in a chat.
    solution: |
      The project has three parts. An iOS app in Swift and UIKit: a home screen with
      public communities, search, a library with playlists, and a room with a shared player
      and chat. A Vapor server with PostgreSQL (Fluent, migrations): users and tokens,
      rooms — public or joined by code, members and the DJ role, room rating, playlists.
      Over WebSocket the server streams audio in chunks to every member of a room, syncs
      play / pause / next / back commands and runs the chat. A separate FastAPI service
      works with Yandex Music: search, tracks, albums, favourites and the playlist of the day.
    results:
      - 3 services — iOS app, Vapor server and FastAPI service
      - Synchronized playback for every room member over WebSocket
      - Real-time community chat
    stack: [Swift, UIKit, Vapor, Fluent, PostgreSQL, WebSocket, Python, FastAPI, Docker]
    links:
      repos:
        - label: iOS app
          url: https://github.com/2Neo2/TeamPlayer
        - label: Vapor server
          url: https://github.com/2Neo2/TeamPlayer-main
        - label: Yandex Music service
          url: https://github.com/2Neo2/TeamPlayer-YM
    screenshots:
      - src: /static/img/projects/teamplayer/home.webp
        alt: "Home: public communities and new tracks"
        device: mobile
      - src: /static/img/projects/teamplayer/room.webp
        alt: "Room: shared player and community chat"
        device: mobile
      - src: /static/img/projects/teamplayer/playlist.webp
        alt: "A playlist in the library"
        device: mobile
      - src: /static/img/projects/teamplayer/members.webp
        alt: "Managing community members"
        device: mobile
    featured: true

