<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ content.profile.name }} — {{ content.profile.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ content.profile.tagline }}{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    // Тему выставляем до отрисовки, чтобы не было вспышки светлой темы
    try {
      const theme = localStorage.getItem("theme");
      if (theme) document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <script src="/static/js/theme.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>

  {% include "partials/header.html" %}

  <main id="main">
    {% block main %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}
</body>
</html>
