[project]
name = "portfolio-site"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "2Neo2", email = "ivandoronin22@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W — стиль, F — ошибки, I — порядок импортов, B — частые баги, UP — современный синтаксис,
# SIM — упрощения, C4 — comprehensions, PT — стиль pytest, N — имена, RUF — правила ruff
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "N", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях — это не опечатка
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
